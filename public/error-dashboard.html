<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            padding: 20px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2a2a2a;
        }

        h1 { font-size: 20px; color: #fff; }

        #status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        #status.connected    { background: #1a3a1a; color: #4caf50; }
        #status.disconnected { background: #3a1a1a; color: #f44336; }
        #status.connecting   { background: #2a2a1a; color: #ff9800; }

        #stats {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px 20px;
            text-align: center;
        }

        .stat-number { font-size: 28px; font-weight: bold; color: #fff; }
        .stat-label  { font-size: 11px; color: #666; margin-top: 4px; }

        #stat-critical .stat-number { color: #f44336; }
        #stat-error .stat-number    { color: #ff9800; }

        #controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        button:hover { background: #2a2a2a; }

        #errors { display: flex; flex-direction: column; gap: 12px; }

        .error-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .error-card.critical { border-left: 4px solid #f44336; }
        .error-card.error    { border-left: 4px solid #ff9800; }
        .error-card.warning  { border-left: 4px solid #ffeb3b; }

        .error-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            cursor: pointer;
        }

        .error-header:hover { background: #222; }

        .error-left  { display: flex; align-items: center; gap: 12px; }
        .error-right { display: flex; align-items: center; gap: 12px; font-size: 12px; color: #666; }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .badge.critical { background: #3a1a1a; color: #f44336; }
        .badge.error    { background: #3a2a1a; color: #ff9800; }
        .badge.warning  { background: #3a3a1a; color: #ffeb3b; }

        .status-code {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            min-width: 40px;
        }

        .error-message {
            font-size: 13px;
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 500px;
        }

        .error-body {
            display: none;
            padding: 16px;
            border-top: 1px solid #2a2a2a;
        }

        .error-body.open { display: block; }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .info-item label {
            display: block;
            font-size: 10px;
            color: #666;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .info-item value {
            display: block;
            font-size: 13px;
            color: #ccc;
            word-break: break-all;
        }

        .stack-toggle {
            font-size: 12px;
            color: #666;
            cursor: pointer;
            margin-bottom: 8px;
            user-select: none;
        }

        .stack-toggle:hover { color: #999; }

        .stack-trace {
            display: none;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 12px;
            font-size: 11px;
            color: #888;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }

        .stack-trace.open { display: block; }

        #empty {
            text-align: center;
            color: #444;
            padding: 60px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <h1>⚡ Error Dashboard</h1>
    <div id="status" class="connecting">Connecting...</div>
</header>

<div id="stats">
    <div class="stat" id="stat-total">
        <div class="stat-number" id="count-total">0</div>
        <div class="stat-label">Total Errors</div>
    </div>
    <div class="stat" id="stat-critical">
        <div class="stat-number" id="count-critical">0</div>
        <div class="stat-label">Critical</div>
    </div>
    <div class="stat" id="stat-error">
        <div class="stat-number" id="count-error">0</div>
        <div class="stat-label">Errors</div>
    </div>
</div>

<div id="controls">
    <button onclick="clearErrors()">Clear Display</button>
</div>

<div id="errors">
    <div id="empty">No errors yet. Waiting...</div>
</div>

<script>
    let ws;
    let counts = { total: 0, critical: 0, error: 0 };

    function connect() {
        ws = new WebSocket('ws://localhost:8080');

        ws.onopen = function() {
            setStatus('connected', 'Connected');
            ws.send(JSON.stringify({ type: 'dashboard' }));
        };

        ws.onclose = function() {
            setStatus('disconnected', 'Disconnected');
            setTimeout(connect, 3000);
        };

        ws.onerror = function() {
            setStatus('disconnected', 'Error');
        };

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.type === 'error') {
                displayError(data.data);
            }
        };
    }

    function setStatus(cls, text) {
        const el = document.getElementById('status');
        el.className = cls;
        el.textContent = text;
    }

    function displayError(error) {
        document.getElementById('empty').style.display = 'none';

        counts.total++;
        if (error.severity === 'critical') counts.critical++;
        else counts.error++;

        document.getElementById('count-total').textContent    = counts.total;
        document.getElementById('count-critical').textContent = counts.critical;
        document.getElementById('count-error').textContent    = counts.error;

        const card = document.createElement('div');
        card.className = `error-card ${error.severity}`;

        const id = 'card-' + Date.now();

        card.innerHTML = `
            <div class="error-header" onclick="toggleCard('${id}')">
                <div class="error-left">
                    <span class="status-code">${error.status_code}</span>
                    <span class="badge ${error.severity}">${error.severity.toUpperCase()}</span>
                    <span class="error-message">${error.message}</span>
                </div>
                <div class="error-right">
                    <span>${error.method} ${error.url}</span>
                    <span>${new Date().toLocaleTimeString()}</span>
                </div>
            </div>
            <div class="error-body" id="${id}">
                <div class="info-grid">
                    <div class="info-item">
                        <label>Exception Type</label>
                        <value>${error.type}</value>
                    </div>
                    <div class="info-item">
                        <label>IP Address</label>
                        <value>${error.ip_address || 'unknown'}</value>
                    </div>
                    <div class="info-item">
                        <label>File</label>
                        <value>${error.file}</value>
                    </div>
                    <div class="info-item">
                        <label>Line</label>
                        <value>${error.line}</value>
                    </div>
                    <div class="info-item">
                        <label>User ID</label>
                        <value>${error.user_id || 'Guest'}</value>
                    </div>
                    <div class="info-item">
                        <label>Request Body</label>
                        <value>${error.request_body || 'none'}</value>
                    </div>
                </div>
                <div class="stack-toggle" onclick="toggleStack('stack-${id}')">
                    ▶ Show Stack Trace
                </div>
                <div class="stack-trace" id="stack-${id}">${error.stack_trace}</div>
            </div>
        `;

        const container = document.getElementById('errors');
        container.insertBefore(card, container.firstChild);
    }

    function toggleCard(id) {
        const el = document.getElementById(id);
        el.classList.toggle('open');
    }

    function toggleStack(id) {
        const el = document.getElementById(id);
        el.classList.toggle('open');
        el.previousElementSibling.textContent = el.classList.contains('open')
            ? '▼ Hide Stack Trace'
            : '▶ Show Stack Trace';
    }

    function clearErrors() {
        document.getElementById('errors').innerHTML =
            '<div id="empty">No errors yet. Waiting...</div>';
        counts = { total: 0, critical: 0, error: 0 };
        document.getElementById('count-total').textContent    = 0;
        document.getElementById('count-critical').textContent = 0;
        document.getElementById('count-error').textContent    = 0;
    }

    connect();
</script>

</body>
</html>
